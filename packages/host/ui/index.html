<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Appshell</title>
  <link rel="icon" type="image/svg+xml" href="mark.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="stylesheet" href="host.css">
  <script src="host.js" defer></script>
</head>
<body>
  <header class="chrome">
    <button id="back" title="Back" aria-label="Back">&#8592;</button>
    <button id="home" title="Home" aria-label="Home">&#8962;</button>
    <img src="mark.svg" alt="" width="20" height="20" class="logo">
    <h1 id="title"></h1>
    <button id="close" title="Close app" aria-label="Close app">&#10005;</button>
  </header>
  <main id="dashboard">
    <section id="install-confirm" class="confirm" role="dialog" aria-labelledby="install-title" hidden>
      <h2 id="install-title">Install app?</h2>
      <p id="install-detail"></p>
      <p id="install-source" class="quiet"></p>
      <div class="actions">
        <button id="install-yes" class="primary">Install</button>
        <button id="install-no">Cancel</button>
      </div>
    </section>
    <section>
      <h2>Apps</h2>
      <ul id="apps" class="apps"></ul>
    </section>
    <section>
      <h2>Widgets</h2>
      <div id="widgets" class="widgets"></div>
      <p id="no-widgets" class="empty">Widgets appear here once an app publishes them.</p>
    </section>
    <section id="catalog-section">
      <h2>App catalog <button id="refresh" class="link">Refresh</button></h2>
      <p id="manager-error" class="error" role="alert" hidden></p>
      <ul id="catalog" class="catalog"></ul>
      <p id="no-catalog" class="empty">No apps in the catalog.</p>
    </section>
  </main>
</body>
</html>
