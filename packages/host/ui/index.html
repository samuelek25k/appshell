<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Appshell</title>
  <link rel="icon" type="image/svg+xml" href="mark.svg">
  <link rel="stylesheet" href="host.css">
  <script src="host.js" defer></script>
</head>
<body>
  <header class="chrome">
    <div class="chrome-nav">
      <button id="back" title="Back (Esc)" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button id="home" title="Home (Cmd/Ctrl+H)" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="currentColor" class="icon"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/></svg>
      </button>
    </div>
    <div class="chrome-brand">
      <img src="mark.svg" alt="" width="22" height="22" class="logo">
      <h1 id="title">Appshell</h1>
    </div>
    <div class="chrome-actions">
      <button id="close" title="Close app" aria-label="Close app">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="icon"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </header>

  <main id="dashboard">
    <div class="search-bar">
      <div class="search-input-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="search-input" placeholder="Search apps and widgets…" autocomplete="off">
        <span id="search-clear" class="search-clear" hidden>✕</span>
      </div>
    </div>

    <section id="install-confirm" class="confirm" role="dialog" aria-labelledby="install-title" hidden>
      <div class="confirm-content">
        <div class="confirm-badge">
          <span class="badge-dot"></span>
          <span>Verified Package</span>
        </div>
        <h2 id="install-title">Install app?</h2>
        <p id="install-detail"></p>
        <p id="install-source" class="quiet"></p>
        <div class="install-caps">
          <h4>Declared Capabilities & Governance</h4>
          <div id="install-caps-list" class="cap-pills"></div>
        </div>
        <div class="actions">
          <button id="install-yes" class="primary">Install & Trust</button>
          <button id="install-no">Cancel</button>
        </div>
      </div>
    </section>

    <section class="shelf-section">
      <div class="shelf-header">
        <h2>Apps</h2>
        <span id="apps-count" class="count-badge"></span>
      </div>
      <ul id="apps" class="apps"></ul>
    </section>

    <section class="shelf-section">
      <div class="shelf-header">
        <h2>Widgets</h2>
      </div>
      <div id="widgets" class="widgets"></div>
      <p id="no-widgets" class="empty">Widgets appear here once an app publishes them.</p>
    </section>

    <section id="catalog-section" class="shelf-section">
      <div class="shelf-header">
        <h2>Catalog</h2>
        <button id="refresh" class="link">↻ Refresh</button>
      </div>
      <p id="manager-error" class="error" role="alert" hidden></p>
      <ul id="catalog" class="catalog"></ul>
      <p id="no-catalog" class="empty">No apps in the catalog.</p>
    </section>
  </main>
</body>
</html>
