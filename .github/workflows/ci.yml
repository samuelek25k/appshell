name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm secrets
      - run: pnpm hygiene
      - run: pnpm check
      - run: pnpm test
      - name: E2E (hostile-app gate, installs, template)
        shell: bash
        env:
          APPSHELL_E2E_REPORT: ${{ runner.temp }}/hostile.json
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            xvfb-run -a pnpm e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"
          else
            pnpm e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"
          fi
      - name: Show e2e failures
        if: failure()
        shell: bash
        run: |
          echo "::error title=hostile report (${{ runner.os }})::$(tr '\n' ' ' < "$RUNNER_TEMP/hostile.json" 2>/dev/null || echo none)"
          echo "::error title=failed tests (${{ runner.os }})::$(grep -A40 '^not ok' "$RUNNER_TEMP/e2e.log" 2>/dev/null | grep -v dbus | head -60 | tr '\n' ' ' || echo none)"
