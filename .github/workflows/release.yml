name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      product:
        description: Product config to build
        default: products/appshell/product.json

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pre-installed apps come from the apps repository, pinned by the catalog in a later phase (D10).
      - uses: actions/checkout@v4
        with:
          repository: samuelek25k/appshell-apps
          path: products/appshell/apps
      - run: pnpm check
      - run: pnpm test
      - run: node scripts/build-config.mjs ${{ inputs.product || 'products/appshell/product.json' }}
      # Unsigned until D12 (signing) is decided; set CSC_LINK and CSC_KEY_PASSWORD secrets to sign.
      - run: pnpm exec electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
