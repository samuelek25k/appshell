<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Facet Gradients for high-contrast precision geometry in both light and dark modes -->
    <linearGradient id="facet-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="facet-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
    <linearGradient id="facet-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="facet-base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
  </defs>

  <style>
    .theme-frame { stroke: #0f172a; opacity: 0.85; }
    .theme-crease { stroke: #ffffff; }
    .theme-accent { stroke: #0284c7; }
    @media (prefers-color-scheme: dark) {
      .theme-frame { stroke: #f8fafc; opacity: 0.9; }
      .theme-crease { stroke: #ffffff; }
    }
    :root.dark .theme-frame { stroke: #f8fafc; opacity: 0.9; }
    :root:not(.dark) .theme-frame { stroke: #0f172a; opacity: 0.85; }
  </style>

  <!-- Transparent Background: Precision Outer Geometric Boundary -->
  <rect x="2" y="2" width="60" height="60" class="theme-frame" stroke-width="1.5" stroke-opacity="0.25" fill="none" />
  
  <!-- Corner Precision Index Marks -->
  <path d="M2 10H8 M10 2V8 M56 2V8 M58 10H62 M2 54H8 M10 56V62 M56 56V62 M58 54H62" class="theme-frame" stroke-width="1.5" opacity="0.6" />

  <!-- Left Wing Structural Facet (VS Code & Mahindra origami precision) -->
  <polygon points="12,46 25,18 32,23 20,49" fill="url(#facet-left)" />
  
  <!-- Right Wing Structural Facet -->
  <polygon points="52,46 39,18 32,23 44,49" fill="url(#facet-right)" />

  <!-- Center Diamond Interlocking Keystone -->
  <polygon points="32,15 41,27 32,36 23,27" fill="url(#facet-core)" />

  <!-- Lower Base Horizon Geometry -->
  <polygon points="20,49 32,41 44,49 32,53" fill="url(#facet-base)" />

  <!-- High-Precision Crisp Crease Highlights -->
  <polyline points="25,18 32,23 39,18" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="miter" stroke-linecap="square" opacity="0.9" />
  <polyline points="20,49 32,41 44,49" stroke="#E0F2FE" stroke-width="1.2" stroke-linejoin="miter" stroke-linecap="square" opacity="0.85" />
</svg>
